name: Feature request
description: Propose an improvement to this project.
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Keep the proposal focused on this repository.
        Do not include secrets or personal data. For vulnerabilities, follow the repository's security policy or [SECURITY.md](https://github.com/wpultimatesecurity/.github/blob/dev/SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or missing, and who encounters it?
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Proposed improvement
      description: Describe the behavior or documentation you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing approaches or workarounds, if any.
  - type: textarea
    id: benefit
    attributes:
      label: Expected benefit
      description: How would this improve the project for its users?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional examples, references, or sketches.
